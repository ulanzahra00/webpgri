name: Deploy Website ke Hosting Arenhost
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Project
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode terbaru dari GitHub
      uses: actions/checkout@v4

    - name: Upload via FTP ke cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ftp.pgrikotamobagu.my.id
        username: pgrikota
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        server-dir: ./
